# Nginx Reverse Proxy Configuration for Supabase Dev
# File: /etc/nginx/sites-available/supabase-dev.dailyworkerhub.com.conf

server {
    listen 80;
    listen [::]:80;
    server_name supabase-dev.dailyworkerhub.com;

    # Enable logging for debugging
    access_log /var/log/nginx/supabase-dev-access.log;
    error_log /var/log/nginx/supabase-dev-error.log;

    # Supabase Auth (GOTRUE) - Default port 9999
    location /auth/v1/ {
        proxy_pass http://127.0.0.1:9999/auth/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }

    # Supabase REST (PostgREST) - Default port 3000
    location /rest/v1/ {
        proxy_pass http://127.0.0.1:3000/rest/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }

    # Supabase Storage - Default port 5000
    location /storage/v1/ {
        proxy_pass http://127.0.0.1:5000/storage/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;

        # Handle large file uploads (max 100MB)
        client_max_body_size 100M;
    }

    # Supabase Functions - Default port 9111
    location /functions/v1/ {
        proxy_pass http://127.0.0.1:9111/functions/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }

    # Supabase Realtime - Default port 4000 (WebSocket)
    location /realtime/v1/ {
        proxy_pass http://127.0.0.1:4000/realtime/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 3600s;
    }

    # Studio (optional) - Default port 54323
    location /studio/ {
        proxy_pass http://127.0.0.1:54323/studio/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Root endpoint (health check)
    location / {
        return 200 '{"status":"ok","services":["auth","rest","storage","functions","realtime"]}';
        add_header Content-Type application/json;
    }
}
