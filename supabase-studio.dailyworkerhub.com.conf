# Nginx Configuration for Supabase Studio
# Domain: supabase-studio.dailyworkerhub.com
# Target: http://127.0.0.1:54323 (Supabase Studio UI)

server {
    listen 80;
    listen [::]:80;
    server_name supabase-studio.dailyworkerhub.com;

    # Logging
    access_log /var/log/nginx/supabase-studio-access.log;
    error_log /var/log/nginx/supabase-studio-error.log;

    # Client Body Size (for large requests)
    client_max_body_size 100M;

    # Redirect HTTP to HTTPS (after SSL is setup)
    # location / {
    #     return 301 https://$server_name$request_uri;
    # }

    # Supabase Studio UI
    location / {
        proxy_pass http://127.0.0.1:54323/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # Health Check Endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Favicon (prevent errors)
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }
}
